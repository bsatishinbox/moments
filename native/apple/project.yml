name: Moment
options:
  bundleIdPrefix: io.github.bsatishinbox.moment
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Moment:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bsatishinbox.moment
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: Moment
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: MomentWatch
        embed: true
    scheme:
      gatherCoverageData: false
      testTargets: []
  MomentWatch:
    type: application
    platform: watchOS
    sources:
      - Shared
      - Watch
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bsatishinbox.moment.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: Moment
        WKApplication: true
        WKCompanionAppBundleIdentifier: io.github.bsatishinbox.moment
        WKRunsIndependentlyOfCompanionApp: true
        ITSAppUsesNonExemptEncryption: false
    scheme:
      gatherCoverageData: false
      testTargets: []
